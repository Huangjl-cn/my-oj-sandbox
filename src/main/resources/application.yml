server:
  port: 8100
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never

# 不设默认 profile：必须显式指定环境，避免生产漏设 SPRING_PROFILES_ACTIVE 时悄悄以开发配置
# （信任公开的开发密钥）运行。本地开发 mvn spring-boot:run 会自动激活 dev（见 pom.xml）；
# IDE 运行时加 VM 参数 -Dspring.profiles.active=dev；服务器由 systemd 环境文件设为 prod。
